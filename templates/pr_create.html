{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold"><i class="fas fa-file-signature text-primary"></i> Create Purchase Request</h5>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Product *</label>
                            <input type="text" name="product" class="form-control" value="{{ form_data.get('product', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select">
                                <option value="IT Hardware" {% if form_data.get('category') == 'IT Hardware' %}selected{% endif %}>IT Hardware</option>
                                <option value="Software" {% if form_data.get('category') == 'Software' %}selected{% endif %}>Software</option>
                                <option value="Office Supplies" {% if form_data.get('category') == 'Office Supplies' %}selected{% endif %}>Office Supplies</option>
                                <option value="Services" {% if form_data.get('category') == 'Services' %}selected{% endif %}>Services</option>
                                <option value="Other" {% if form_data.get('category') == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            <input type="number" name="quantity" class="form-control" value="{{ form_data.get('quantity', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Max Budget per Unit (₹) *</label>
                            <input type="number" step="0.01" name="budget" class="form-control" value="{{ form_data.get('budget', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Required Delivery Date *</label>
                            <input type="date" name="delivery_date" class="form-control" value="{{ form_data.get('delivery_date', '') }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="Low" {% if form_data.get('priority') == 'Low' %}selected{% endif %}>Low</option>
                            <option value="Medium" {% if form_data.get('priority') == 'Medium' %}selected{% endif %}>Medium</option>
                            <option value="High" {% if form_data.get('priority') == 'High' %}selected{% endif %}>High</option>
                            <option value="Critical" {% if form_data.get('priority') == 'Critical' %}selected{% endif %}>Critical</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ form_data.get('description', '') }}</textarea>
                    </div>
                    <div class="mt-4 pt-3 border-top text-end">
                        <a href="/purchase-requests" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-paper-plane me-1"></i> Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
